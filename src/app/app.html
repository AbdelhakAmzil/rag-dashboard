<div class="app-shell">
  <button class="hamburger-btn" (click)="uiState.toggleSidebar()">☰</button>
  <aside class="sidebar" [class.sidebar-open]="uiState.isSidebarOpen()">
    <app-sidebar></app-sidebar>
  </aside>
  <main class="chat-area">
    <app-chat-header></app-chat-header>
    <div class="chat-messages">
      @if (conversation.messages().length === 0) {
        <div class="empty-state">
          <h1 class="empty-title">Welcome to RAG Chatbot</h1>
          <p class="empty-subtitle">Ask a question about your documents to get started.</p>

          <div class="quick-actions">
            <button class="quick-action-btn" (click)="askQuickQuestion('Summarize the latest documents I uploaded')">
              <span class="quick-action-icon">📄</span>
              Summarize documents
            </button>
            <button class="quick-action-btn" (click)="askQuickQuestion('Explain how RAG architecture works')">
              <span class="quick-action-icon">🧠</span>
              Explain RAG architecture
            </button>
            <button class="quick-action-btn" (click)="askQuickQuestion('What are the best practices for chunking documents?')">
              <span class="quick-action-icon">✂️</span>
              Chunking best practices
            </button>
          </div>
        </div>
      } @else {
        @for (msg of conversation.messages(); track $index) {
          <app-message-bubble [message]="msg"></app-message-bubble>
        }
        @if (conversation.isLoading()) {
          <div class="message assistant-message">
            <div class="avatar assistant-avatar">🔷</div>
            <div class="message-content">
              <div class="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
              </div>
            </div>
          </div>
        }
      }
    </div>
    <app-chat-input></app-chat-input>
  </main>
  <aside class="sources-panel" [class.sources-open]="uiState.isSourcesPanelOpen()">
    <app-sources-panel></app-sources-panel>
  </aside>
</div>
