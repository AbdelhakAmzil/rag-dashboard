<div class="toast-container">
  @for (toast of notification.toasts(); track toast.id) {
    <div class="toast-card" [class.toast-success]="toast.type === 'success'" [class.toast-error]="toast.type === 'error'">
      <div class="toast-icon">{{ toast.type === 'success' ? '✓' : '✕' }}</div>
      <div class="toast-body">
        <span class="toast-title">{{ toast.title }}</span>
        <span class="toast-message">{{ toast.message }}</span>
      </div>
      <button class="toast-close" (click)="notification.dismiss(toast.id)">✕</button>
    </div>
  }
</div>
