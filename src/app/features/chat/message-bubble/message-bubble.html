@if (message().role === 'user') {
  <div class="message user-message">
    <div class="avatar">AA</div>
    <div class="message-content">
      <div class="message-header">
        <span class="sender">You</span>
        <span class="timestamp">{{ message().timestamp }}</span>
      </div>

      @if (isEditing()) {
        <textarea
          class="edit-textarea"
          [(ngModel)]="editText"
          rows="3"></textarea>
        <div class="edit-actions">
          <button class="edit-btn edit-cancel" (click)="cancelEdit()">Cancel</button>
          <button class="edit-btn edit-confirm" (click)="confirmEdit()">Save & regenerate</button>
        </div>
      } @else {
        <div class="message-text">
          {{ message().text }}
        </div>
        <div class="message-actions">
          <button class="action-btn" (click)="onCopy()" title="Copy">
            {{ justCopied() ? '✓' : '📋' }}
          </button>
          <button class="action-btn" (click)="startEdit()" title="Edit">
            ✏️
          </button>
        </div>
      }
    </div>
  </div>
} @else {
  <div class="message assistant-message">
    <div class="avatar assistant-avatar">🔷</div>
    <div class="message-content">
      <div class="message-header">
        <span class="sender">RAG Chatbot</span>
        <span class="timestamp">{{ message().timestamp }}</span>
      </div>
      <div class="message-text markdown-body" [innerHTML]="renderedText()"></div>
      @if (message().sources && message().sources!.length > 0) {
        <div class="sources-row">
          @for (source of message().sources; track source) {
            <app-source-card [fileName]="source"></app-source-card>
          }
        </div>
      }
      <div class="message-actions">
        <button class="action-btn" (click)="onCopy()" title="Copy">
          {{ justCopied() ? '✓' : '📋' }}
        </button>
        <button
          class="action-btn"
          [class.active]="feedback() === 'LIKE'"
          (click)="onLike()"
          title="Like">
          👍
        </button>
        <button
          class="action-btn"
          [class.active]="feedback() === 'DISLIKE'"
          (click)="onDislike()"
          title="Dislike">
          👎
        </button>
        <button class="action-btn" (click)="onRegenerate()" title="Regenerate">
          🔄
        </button>
      </div>
    </div>
  </div>
}
