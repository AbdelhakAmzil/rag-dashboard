<div
  class="app-shell"
  [style.--sidebar-w]="uiState.isSidebarOpen() ? '260px' : '0px'"
  [style.--sources-w]="uiState.isSourcesPanelOpen() ? '340px' : '0px'">
  <div class="glow-blob glow-blob-1"></div>
  <div class="glow-blob glow-blob-2"></div>

  @if (!uiState.isSidebarOpen()) {
    <button class="hamburger-btn" (click)="uiState.toggleSidebar()" title="Show sidebar">☰</button>
  }

  <aside class="sidebar" [class.sidebar-open]="uiState.isSidebarOpen()" [class.is-collapsed]="!uiState.isSidebarOpen()">
    <app-sidebar></app-sidebar>
  </aside>
  <main class="chat-area">
    <app-chat-header></app-chat-header>
    <div class="chat-messages" #scrollAnchor (scroll)="onScroll($event)">
      @if (conversation.messages().length === 0) {
        <div class="empty-state">
          <h1 class="empty-title">Welcome to RAG Chatbot</h1>
          <p class="empty-subtitle">Ask a question about your documents to get started.</p>

          <div class="quick-actions">
            <button class="quick-action-btn" (click)="askQuickQuestion('Summarize the latest documents I uploaded')">
              <span class="quick-action-icon">📄</span>
              Summarize documents
            </button>
            <button class="quick-action-btn" (click)="askQuickQuestion('Explain how RAG architecture works')">
              <span class="quick-action-icon">🧠</span>
              Explain RAG architecture
            </button>
            <button class="quick-action-btn" (click)="askQuickQuestion('What are the best practices for chunking documents?')">
              <span class="quick-action-icon">✂️</span>
              Chunking best practices
            </button>
          </div>
        </div>
      } @else {
        @for (msg of conversation.messages(); track $index) {
          <app-message-bubble
            [message]="msg"
            [typing]="conversation.isLoading() && $last && !lastMessageHasContent()"
            (regenerate)="onRegenerate(msg)"
            (edit)="onEdit(msg, $event)">
          </app-message-bubble>
        }
      }
    </div>
    <app-chat-input></app-chat-input>
  </main>
  <aside class="sources-panel" [class.sources-open]="uiState.isSourcesPanelOpen()" [class.is-collapsed]="!uiState.isSourcesPanelOpen()">
    <app-sources-panel></app-sources-panel>
  </aside>
</div>

<app-document-preview-overlay></app-document-preview-overlay>
