<h2 class="chat-title">{{ conversation.activeConversationTitle() || 'New Chat' }}</h2>

<div class="header-actions">
  <button
    class="theme-toggle"
    [class.is-dark]="uiState.isDarkMode()"
    (click)="uiState.toggleDarkMode()"
    title="Toggle theme">
    <svg class="theme-icon" viewBox="0 0 24 24" fill="none" width="14" height="14">
      <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
      <path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="theme-thumb"></span>
    <svg class="theme-icon" viewBox="0 0 24 24" fill="none" width="14" height="14">
      <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </svg>
  </button>

  <button class="share-btn" (click)="onShare()">
    <span class="share-icon">⇅</span>
    @if (justCopied()) {
      Copied!
    } @else {
      Share
    }
  </button>

  <div class="sources-toggle">
    <span>Sources</span>
    <label class="switch">
      <input
        type="checkbox"
        [checked]="uiState.isSourcesPanelOpen()"
        (change)="uiState.toggleSourcesPanel()">
      <span class="slider"></span>
    </label>
  </div>
</div>
