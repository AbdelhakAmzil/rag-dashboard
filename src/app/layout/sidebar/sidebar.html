<div class="sidebar-header">
  <div class="logo-icon">🔷</div>
  <span class="logo-text">RAG Chatbot</span>
</div>

<button class="new-chat-btn" (click)="onNewChat()">
  <span class="plus-icon">+</span>
  New Chat
</button>

<div class="conversation-group">
  <span class="group-label">Conversations</span>
  <ul class="conversation-list">
    @for (conv of conversation.conversations(); track conv.id) {
      <li
        class="conversation-item"
        [class.active]="conv.id === conversation.activeConversationId()"
        (click)="onSelectConversation(conv.id)">

        @if (editingId() === conv.id) {
          <input
            class="rename-input"
            [(ngModel)]="editingTitle"
            (click)="$event.stopPropagation()"
            (keyup.enter)="confirmRename(conv.id)"
            (keyup.escape)="cancelRename()"
            (blur)="confirmRename(conv.id)"
            autofocus />
        } @else {
          <span class="conversation-title">{{ conv.title }}</span>
          <div class="conversation-actions">
            <button class="conv-action-btn" (click)="startRename(conv.id, conv.title, $event)" title="Rename">✏️</button>
            <button class="conv-action-btn" (click)="onDelete(conv.id, $event)" title="Delete">🗑️</button>
          </div>
        }
      </li>
    }
  </ul>
</div>

<div class="upgrade-card">
  <div class="upgrade-title">
    <span class="star-icon">⭐</span>
    <strong>Upgrade to Pro</strong>
  </div>
  <p class="upgrade-text">Unlock more tokens, larger file uploads and history.</p>
  <button class="upgrade-btn">Upgrade Now</button>
</div>

<button class="theme-toggle" (click)="uiState.toggleDarkMode()">
  @if (uiState.isDarkMode()) {
    ☀️ Light mode
  } @else {
    🌙 Dark mode
  }
</button>

<div class="user-profile">
  <div class="avatar">AA</div>
  <div class="user-info">
    <span class="user-name">{{ auth.currentUsername() }}</span>
  </div>
  <button class="logout-btn" (click)="onLogout()" title="Log out">🚪</button>
</div>
